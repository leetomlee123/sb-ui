name: Windows Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release-windows:
    name: Build & Release Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Download bundled sing-box & Wintun binary (Windows amd64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path core-bin
          $tag = (Invoke-RestMethod -Uri "https://api.github.com/repos/SagerNet/sing-box/releases/latest").tag_name
          $version = $tag.TrimStart('v')
          Write-Host "Fetching sing-box $tag for windows-amd64..."
          $url = "https://github.com/SagerNet/sing-box/releases/download/$tag/sing-box-$version-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile "singbox.zip"
          Expand-Archive -Path "singbox.zip" -DestinationPath "singbox_extracted"
          Copy-Item -Path "singbox_extracted/sing-box-$version-windows-amd64/sing-box.exe" -Destination "core-bin/sing-box.exe"

          Write-Host "Fetching official Wintun driver (0.14.1)..."
          $wintunUrl = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          Invoke-WebRequest -Uri $wintunUrl -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun_extracted"
          Copy-Item -Path "wintun_extracted/wintun/bin/amd64/wintun.dll" -Destination "core-bin/wintun.dll"

      - name: Install dependencies & verify
        run: |
          flutter pub get
          flutter test

      - name: Build Flutter Windows Release
        run: |
          flutter build windows --release --obfuscate --split-debug-info=build/symbols --tree-shake-icons

      - name: Prepare Windows Release Bundle & Package with desktop_updater
        shell: pwsh
        env:
          DESKTOP_UPDATER_KEY_BUNDLE_PASSPHRASE: "SingularAppReleaseKey2026Pass"
        run: |
          $bundleDir = "build/windows/x64/runner/Release"
          
          # Copy sing-box core and Wintun driver into bundle
          New-Item -ItemType Directory -Force -Path "$bundleDir/data/core"
          Copy-Item -Path "core-bin/sing-box.exe" -Destination "$bundleDir/data/core/sing-box.exe"
          Copy-Item -Path "core-bin/wintun.dll" -Destination "$bundleDir/data/core/wintun.dll"
          Copy-Item -Path "core-bin/wintun.dll" -Destination "$bundleDir/wintun.dll"

          # Copy offline rule sets into bundle config
          New-Item -ItemType Directory -Force -Path "$bundleDir/config"
          Copy-Item -Path "assets/rules/*" -Destination "$bundleDir/config"

          # Import release signing key bundle
          dart run desktop_updater:release keys import --input release-key.dukey --passphrase-env DESKTOP_UPDATER_KEY_BUNDLE_PASSPHRASE

          # Attempt incremental update first, fallback to initial feed creation if no feed exists yet
          Write-Host "Publishing update with desktop_updater..."
          $publishOutput = & dart run desktop_updater:release publish --platform windows --project-type flutter --app-name singular --package-id singular 2>&1
          $publishExit = $LASTEXITCODE
          Write-Host ($publishOutput -join "`n")
          if ($publishExit -ne 0) {
            Write-Host "Incremental publish returned exit code $publishExit. Attempting initial feed publication..."
            dart run desktop_updater:release publish --platform windows --project-type flutter --app-name singular --package-id singular --initialize-feed
          }

          # Generate SHA256 Checksum for the signed desktop_updater release package
          $artifactZip = Get-ChildItem -Path "dist/desktop_updater/releases" -Filter "*.zip" -Recurse | Select-Object -First 1
          if ($artifactZip) {
            $hash = (Get-FileHash -Path $artifactZip.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($artifactZip.Name)" | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii
            Write-Host "Generated checksum for $($artifactZip.Name): $hash"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: Singular ${{ github.ref_name || github.event.inputs.tag_name }} (Windows)
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/desktop_updater/app-archive.json
            dist/desktop_updater/releases/**/release.json
            dist/desktop_updater/releases/**/*.zip
            SHA256SUMS.txt
